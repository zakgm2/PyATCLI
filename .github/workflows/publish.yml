name: Publish to PyPI

# Runs when you push a version tag, e.g.:
#   git tag v2026.11.5
#   git push origin v2026.11.5
#
#   build    checks that the tag, pyproject.toml, CITATION.cff and CHANGELOG.md agree (before anything is uploaded: PyPI never takes a version
#            twice), builds the sdist and wheel, and cuts the version's section out of CHANGELOG.md as the release notes
#   publish  uploads to PyPI (Trusted Publishing: the PyPI side names this file and the environment `pypi`, so do not rename either)
#   release  creates the GitHub Release for the tag, with those notes and the sdist and wheel attached. Zenodo archives published Releases and
#            gives each its DOI, so this is what archives the version. If it fails after `publish` succeeded the version is already on PyPI:
#            publish the Release by hand from the existing tag (Releases -> Draft a new release -> choose the tag, do not type a new one).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag, the version and the changelog agree
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" release_notes.md

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: release_notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyatcli
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the Release: the default token is read-only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes/

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: PyATCLI ${{ github.ref_name }}
          body_path: notes/release_notes.md
          files: dist/*
