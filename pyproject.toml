[build-system]
# 77+ for the SPDX-string `license` / `license-files` fields below (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyATCLI"
version = "2026.11.5"
description = "The analysis library, engine and command line behind PyAT: TDT fibre photometry, Oxysoft NIRS, Terranova EFNMR and text-field studies, with provenance records (formerly PhysicsLibrary)"
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "zakgm2" },
]
keywords = ["pyat", "physics", "neuroscience", "fibre-photometry", "NIRS", "TDT", "EFNMR", "signal-processing", "text-analysis", "nlp", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy",
    "tdt",
    "pandas",
    "openpyxl",
    "sentence-transformers",
    "statsmodels",
    "scikit-learn",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/zakgm2/PyATCLI"
Repository = "https://github.com/zakgm2/PyATCLI"
Changelog = "https://github.com/zakgm2/PyATCLI/blob/main/CHANGELOG.md"

[project.scripts]
# `pyatcli run ...` / `pyatcli reproduce ...` — the same as `python -m PyATCLI` (see PyATCLI/cli/)
pyatcli = "PyATCLI.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["PyATCLI*"]
